name: Tests et images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hunspell (dictionnaire français)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends hunspell hunspell-fr
      - name: Dépendances
        run: pip install -r docformatter/requirements.txt pytest httpx
      - name: Tests
        working-directory: docformatter
        run: pytest -q

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Version et dépôt d'images
        id: info
        run: |
          version=$(sed -nE 's/^version: *"?([^"]+)"?.*/\1/p' docformatter/config.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docformatter-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docformatter
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=python:3.12-slim-bookworm
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
            ${{ steps.info.outputs.image }}:latest
          labels: |
            io.hass.type=addon
            io.hass.name=DocFormatter
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.info.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
