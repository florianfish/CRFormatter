name: DocFormatter
version: "0.8.0"
slug: docformatter
description: Mise en forme et vérification orthographique des comptes rendus médicaux copiés depuis Word, sans IA
url: https://github.com/florianfish/CRFormatter
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:file-document-edit-outline
panel_title: Comptes rendus
# Visible par tous les utilisateurs HA, y compris non administrateurs.
panel_admin: false
map:
  - type: addon_config
    read_only: false
options:
  acces_direct: false
  utilisateurs: []
schema:
  acces_direct: bool
  utilisateurs:
    - nom: str
      mot_de_passe: password
# Image publiée par la GitHub Action (le tag correspond à « version »).
# Commenter cette ligne pour que le Supervisor construise l'image localement à partir du Dockerfile.
image: ghcr.io/florianfish/docformatter-{arch}
